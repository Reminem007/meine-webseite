<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Meine Daten</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:">
<style>
:root {
  color-scheme: light;
  --page: #f3f2ee; --surface: #fcfcfb; --surface-2: #efeee9; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e5e4dd; --axis: #c3c2b7; --ring: rgba(11,11,11,0.07); --track: #e9e8e2;
  --shadow: 0 1px 2px rgba(20,20,10,.04), 0 6px 20px rgba(20,20,10,.04);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b; --good-text: #006300;
  --sleep: #6b5bd2; --deep: #1f49b6; --light: #58a6ff; --rem: #b25fd9; --awake: #f27fb5;
  --heart: #d9435f; --steps: var(--s1); --bb: var(--s3); --stress: var(--s4); --kcal: var(--s2);
  --im: #e2367a; --weight: var(--s3); --fat: var(--s4); --musc: var(--s1); --kraft: var(--s2); --work: #0f8fa5; --resp: #2a9bb5; --mood: #6b5bd2; --energy: #eb6834; --tension: #2a9bb5;
  --body: #e6e4dd; --idle: #d3d1c8; --heat1: #f6d68a; --heat2: #f3a65a; --heat3: #e8693e; --heat4: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232322; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #8f8d86;
    --grid: #2c2c2a; --axis: #3b3b38; --ring: rgba(255,255,255,0.07); --track: #2b2b29; --shadow: none;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --good-text: #3fbf3f;
    --sleep: #8b7df0; --deep: #3a64d8; --light: #6cb2ff; --rem: #c27ae6; --awake: #f28fbf;
    --heart: #e5566f; --im: #ec5a92; --work: #22a7bd; --resp: #45b3cc;
    --body: #262624; --idle: #363633; --heat1: #8a7230; --heat2: #c27a2e; --heat3: #e0603a; --heat4: #ef4b4b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232322; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #8f8d86;
  --grid: #2c2c2a; --axis: #3b3b38; --ring: rgba(255,255,255,0.07); --track: #2b2b29; --shadow: none;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --good-text: #3fbf3f;
  --sleep: #8b7df0; --deep: #3a64d8; --light: #6cb2ff; --rem: #c27ae6; --awake: #f28fbf;
  --heart: #e5566f; --im: #ec5a92; --work: #22a7bd; --resp: #45b3cc;
  --body: #262624; --idle: #363633; --heat1: #8a7230; --heat2: #c27a2e; --heat3: #e0603a; --heat4: #ef4b4b;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* ---------- Sperrbildschirm */
#lock { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
#lock form { background: var(--surface); border: 1px solid var(--ring); border-radius: 20px; padding: 28px; width: 100%; max-width: 360px; box-shadow: var(--shadow); }
#lock h1 { margin: 0 0 4px; font-size: 22px; }
#lock .sub { color: var(--muted); font-size: 13px; }
#lock input[type=password] { width: 100%; padding: 11px 12px; border: 1px solid var(--axis); border-radius: 10px; background: var(--page); margin: 14px 0 12px; }
#lock .primary { width: 100%; padding: 11px; border: 0; border-radius: 10px; background: var(--ink); color: var(--page); font-weight: 600; }
#lock .err { color: var(--critical); font-size: 13px; min-height: 18px; margin-top: 8px; }
label.check { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-2); margin-bottom: 14px; }

/* ---------- Grundgerüst */
#app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
nav.side { position: sticky; top: 0; height: 100vh; padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid var(--ring); }
.brand { font-weight: 700; font-size: 18px; padding: 4px 10px 16px; display: flex; gap: 10px; align-items: center; }
.brand .logo { width: 28px; height: 28px; border-radius: 9px; background: linear-gradient(135deg, var(--s2), var(--im)); display: grid; place-items: center; color: #fff; }
.navbtn { display: flex; align-items: center; gap: 12px; border: 0; background: transparent; padding: 9px 10px; border-radius: 10px; text-align: left; color: var(--ink-2); font-weight: 500; }
.navbtn svg { width: 20px; height: 20px; flex: none; }
.navbtn:hover { background: var(--surface-2); }
.navbtn[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); border: 1px solid var(--ring); }
.side .foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 0 6px; }
.side .foot .sub { color: var(--muted); font-size: 12px; }
.ghost { border: 1px solid var(--ring); background: var(--surface); padding: 7px 12px; border-radius: 10px; font-size: 13px; }
.row2 { display: flex; gap: 6px; }
.row2 .ghost { flex: 1; }
main { padding: 18px 28px 80px; max-width: 1240px; width: 100%; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.topbar h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
.topbar .sub { color: var(--muted); font-size: 13px; }

/* ---------- Zeitraum */
.rangebar { display: flex; align-items: center; gap: 6px; position: relative; }
.rangebar .arrow { width: 34px; height: 36px; border-radius: 10px; border: 1px solid var(--ring); background: var(--surface); display: grid; place-items: center; }
.rangebar .arrow:disabled { opacity: .35; cursor: default; }
#rangeBtn { display: flex; align-items: center; gap: 10px; border: 1px solid var(--ring); background: var(--surface); border-radius: 10px; padding: 7px 12px; box-shadow: var(--shadow); min-height: 36px; }
#rangeBtn b { font-weight: 600; }
#rangeBtn span { color: var(--muted); font-size: 13px; }
#rangePop { position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; background: var(--surface); border: 1px solid var(--ring); border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.18); display: grid; grid-template-columns: 170px auto; overflow: hidden; }
.presets { border-right: 1px solid var(--grid); padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.presets button { border: 0; background: transparent; text-align: left; padding: 7px 10px; border-radius: 8px; font-size: 14px; }
.presets button:hover { background: var(--surface-2); }
.presets button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
.cal { padding: 12px 14px; }
.calhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.calhead button { border: 0; background: transparent; width: 30px; height: 30px; border-radius: 8px; }
.calhead button:hover { background: var(--surface-2); }
.months { display: flex; gap: 20px; }
.month h4 { margin: 0 0 6px; font-size: 14px; text-align: center; font-weight: 600; }
.days { display: grid; grid-template-columns: repeat(7, 34px); gap: 2px 0; font-size: 13px; text-align: center; }
.days .wd { color: var(--muted); font-size: 11px; padding-bottom: 4px; }
.days button { border: 0; background: transparent; height: 32px; border-radius: 8px; font-variant-numeric: tabular-nums; }
.days button:hover { outline: 1px solid var(--axis); }
.days button.in { background: color-mix(in srgb, var(--s1) 16%, transparent); border-radius: 0; }
.days button.edge { background: var(--s1); color: #fff; border-radius: 8px; }
.days button.today { font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.days button:disabled { opacity: .3; cursor: default; outline: none; }
.calfoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--grid); font-size: 13px; color: var(--ink-2); }
.calfoot .primary { border: 0; background: var(--ink); color: var(--page); padding: 7px 14px; border-radius: 9px; font-weight: 600; }
.calfoot .primary:disabled { opacity: .4; }

/* ---------- Karten */
.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; grid-auto-flow: row dense; }
.rows2 { grid-row: span 2; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 18px; padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; position: relative; }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
.ch { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.ch h3 { margin: 0; font-size: 15px; font-weight: 600; }
.ch .ic { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.ch .ic svg { width: 17px; height: 17px; }
.ch .right { margin-left: auto; color: var(--muted); font-size: 12px; }
.big { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.big small { font-size: 15px; font-weight: 600; color: var(--ink-2); letter-spacing: 0; margin-left: 2px; }
.muted { color: var(--muted); font-size: 13px; }
.kv { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 8px; }
.kv div { font-size: 12px; color: var(--muted); }
.kv b { display: block; color: var(--ink); font-size: 15px; font-variant-numeric: tabular-nums; }
.ringrow { display: flex; align-items: center; gap: 16px; }
.ring { position: relative; flex: none; }
.ring .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.15; }
.ring .mid b { font-size: 22px; font-variant-numeric: tabular-nums; }
.ring .mid span { display: block; font-size: 11px; color: var(--muted); }
.mini { height: 64px; margin-top: 10px; }
.chartbox { height: 220px; position: relative; }
.chartbox.tall { height: 260px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend b { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; margin-left: 3px; }
.split { display: flex; height: 10px; border-radius: 6px; overflow: hidden; gap: 2px; margin-top: 10px; }
.split div { height: 100%; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 14px; }
.tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); }
.tile .label { color: var(--ink-2); font-size: 13px; }
.tile .value { font-size: 24px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.tile .note { color: var(--muted); font-size: 12px; }
.alert { display: flex; gap: 10px; align-items: center; border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; font-size: 14px;
  background: color-mix(in srgb, var(--warning) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warning) 45%, transparent); }
.alert.bad { background: color-mix(in srgb, var(--critical) 12%, var(--surface)); border-color: color-mix(in srgb, var(--critical) 45%, transparent); }
.alert .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warning); flex: none; }
.alert.bad .dot { background: var(--critical); }
.alert button { margin-left: auto; border: 0; background: transparent; text-decoration: underline; color: inherit; font-size: 13px; }
/* ---------- Tipps */
.tips { background: var(--surface); border: 1px solid var(--ring); border-radius: 18px; padding: 16px 18px; box-shadow: var(--shadow); margin-bottom: 14px; }
.tips .hd { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.tips .hd h2 { margin: 0; font-size: 17px; }
.tips .hd span { color: var(--muted); font-size: 12px; }
.tiplist { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.tip-i { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 14px;
  background: color-mix(in srgb, var(--tc) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--tc) 28%, transparent); }
.tip-i .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--tc) 20%, transparent); color: var(--tc); }
.tip-i .ic svg { width: 18px; height: 18px; }
.tip-i b { display: block; font-size: 14.5px; line-height: 1.3; }
.tip-i small { display: block; color: var(--ink-2); font-size: 12.5px; margin-top: 3px; line-height: 1.35; }
.tip-i .cat { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
.tip-i .per { display: flex; align-items: center; gap: 5px; margin-top: 7px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tip-i .per svg { width: 12px; height: 12px; flex: none; }
.tip-i .tb { min-width: 0; flex: 1; }
.life { margin-top: 9px; }
.life .lbar { height: 3px; border-radius: 3px; background: color-mix(in srgb, var(--tc) 18%, transparent); overflow: hidden; }
.life .lbar i { display: block; height: 100%; border-radius: 3px; background: var(--tc); }
.life.open .lbar i { background: linear-gradient(90deg, var(--tc) 70%, transparent); }
.life .lt { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.life .lt span:first-child { white-space: nowrap; }
.life .lt span:last-child { text-align: right; }
.bodygrid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
@media (max-width: 700px) { .bodygrid { grid-template-columns: minmax(0, 1fr); } }
.body-kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px 14px; margin-top: 0; }
.body-kv b { display: block; }
.dl { font-size: 11.5px; font-weight: 600; color: var(--muted); margin-left: 4px; }
.dl.good { color: var(--good-text, var(--good)); } .dl.bad { color: var(--s4); }
.segbox { display: grid; gap: 4px; }
.bodycharts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 12px; }
@media (max-width: 900px) { .bodycharts { grid-template-columns: minmax(0, 1fr); } }
.bct { font-size: 12.5px; margin-bottom: 4px; }
.segsvg { width: 100%; max-width: 280px; height: auto; margin: 0 auto; display: block; }
.segsvg .segv { font-size: 12px; font-weight: 700; fill: var(--musc); }
.segsvg .segf { font-size: 11px; fill: var(--fat); }
.segsvg .segl { font-size: 10.5px; fill: var(--muted); }
.tiplegend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 11px; color: var(--muted); }
.tiplegend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
.tips .more { margin-top: 10px; border: 0; background: transparent; color: var(--ink-2); font-size: 13px; text-decoration: underline; padding: 0; }
/* ---------- Info & Technik */
.sysgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 14px; }
@media (max-width: 560px) { .sysgrid { grid-template-columns: minmax(0, 1fr); } .sys dl { grid-template-columns: minmax(0, 1fr); gap: 0; } .sys dt { margin-top: 8px; font-size: 12.5px; } }
.sys dl { display: grid; grid-template-columns: 112px 1fr; gap: 6px 12px; margin: 0; font-size: 14px; }
.sys dt { color: var(--muted); }
.sys dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.sys code, .md code { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; overflow-wrap: anywhere; }
.sys ul, .md ul, .md ol { margin: 4px 0; padding-left: 18px; }
.sys li { margin: 2px 0; }
.md { font-size: 14.5px; line-height: 1.55; max-width: 900px; }
.md h1 { font-size: 22px; margin: 6px 0 10px; } .md h2 { font-size: 18px; margin: 24px 0 8px; } .md h3 { font-size: 15.5px; margin: 16px 0 6px; }
.md pre { background: var(--surface-2); border-radius: 10px; padding: 12px; overflow-x: auto; font-size: 12.5px; line-height: 1.45; }
.md pre code { background: none; padding: 0; }
.md table { margin: 8px 0; } .md .tw { overflow-x: auto; }
.md hr { border: 0; border-top: 1px solid var(--grid); margin: 18px 0; }
details.card > summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary::after { content: "▸"; margin-left: auto; color: var(--muted); }
details.card[open] > summary::after { content: "▾"; }
.empty { color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; }
.section-note { color: var(--muted); font-size: 12px; margin: -6px 0 12px; }

/* ---------- Diagramme */
.svgchart { width: 100%; height: 100%; position: relative; }
.svgchart svg { display: block; width: 100%; height: 100%; overflow: visible; touch-action: pan-y; }
.svgchart .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.svgchart .gl { stroke: var(--grid); stroke-width: 1; }
.svgchart .base { stroke: var(--axis); stroke-width: 1; }
.svgchart .goal { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 4 4; opacity: .7; }
.svgchart .goaltxt { fill: var(--ink-2); font-size: 10px; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--page); font-size: 12px; line-height: 1.4;
  padding: 6px 9px; border-radius: 8px; white-space: nowrap; z-index: 5; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.cross { stroke: var(--axis); stroke-width: 1; }

/* ---------- Listen und Tabellen */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--grid); }
.li:last-child { border-bottom: 0; }
.li .ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.li .ic svg { width: 19px; height: 19px; }
.li .t { flex: 1; min-width: 0; }
.li .t b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .t span { color: var(--muted); font-size: 12px; }
.li .m { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
.li .m span { display: block; color: var(--muted); font-size: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th { text-align: left; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--grid); padding: 6px 8px; }
td { border-bottom: 1px solid var(--grid); padding: 7px 8px; vertical-align: top; }
td:first-child { white-space: nowrap; }
.tablewrap { overflow-x: auto; }
.chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); margin: 1px 2px 1px 0; white-space: nowrap; }
.status { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.status .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.ok .dot { background: var(--good); } .ok { color: var(--good-text); }
.warn .dot { background: var(--warning); }
.bad .dot { background: var(--critical); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 8px; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }
select { padding: 5px 8px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); max-width: 100%; }

/* ---------- Muskelkarte */
.bodywrap { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-width: 420px; margin: 0 auto; }
.bodywrap.small { max-width: 190px; }
.bodywrap figure { margin: 0; text-align: center; }
.bodywrap figcaption { color: var(--muted); font-size: 11px; }
.bodysvg { width: 100%; height: auto; display: block; }
.bodysvg .b { fill: var(--body); }
.bodysvg [data-m] { stroke: var(--surface); stroke-width: 1; transition: fill .2s; }
.musclestats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; text-align: center; }
.musclestats div { background: var(--surface-2); border-radius: 12px; padding: 8px 4px; }

/* ---------- Mobil */
nav.bottom { display: none; }
@media (max-width: 1080px) {
  .c3 { grid-column: span 6; } .c4 { grid-column: span 6; } .c5, .c7 { grid-column: span 12; } .c8 { grid-column: span 12; }
}
@media (max-width: 820px) {
  #app { grid-template-columns: minmax(0, 1fr); }
  nav.side { display: none; }
  main { padding: 12px 16px calc(84px + env(safe-area-inset-bottom)); }
  .topbar h1 { font-size: 22px; }
  .c3, .c4, .c6 { grid-column: span 12; }
  .grid { gap: 12px; }
  .grid.ov .c3, .grid.ov .c4 { grid-column: span 6; }
  nav.bottom { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--ring); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); justify-content: space-around; }
  nav.bottom button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; color: var(--muted); padding: 4px 6px; min-width: 56px; }
  nav.bottom button svg { width: 22px; height: 22px; }
  nav.bottom button[aria-current="page"] { color: var(--ink); font-weight: 600; }
  #rangePop { position: fixed; left: 8px; right: 8px; top: 64px; grid-template-columns: 1fr; max-height: calc(100vh - 160px); overflow-y: auto; }
  .presets { border-right: 0; border-bottom: 1px solid var(--grid); flex-direction: row; flex-wrap: wrap; gap: 4px; }
  .presets button { background: var(--surface-2); font-size: 13px; padding: 6px 10px; }
  .month + .month { display: none; }
  .days { grid-template-columns: repeat(7, 1fr); }
  .rangebar { width: 100%; }
  #rangeBtn { flex: 1; justify-content: space-between; }
  .mrank .r { grid-template-columns: 96px 1fr 40px; }
}
@media (max-width: 420px) {
  .grid.ov .c3, .grid.ov .c4 { grid-column: span 12; }
  .big { font-size: 26px; }
}
</style>

<body>

<div id="lock">
  <form id="lockform" autocomplete="on">
    <h1>Meine Daten</h1>
    <div class="sub">Die Daten sind verschlüsselt. Zum Anzeigen Passwort eingeben.</div>
    <input type="text" name="username" value="dashboard" autocomplete="username" hidden>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Passwort" required>
    <label class="check"><input id="remember" type="checkbox" checked> Auf diesem Gerät merken</label>
    <button class="primary" type="submit" id="unlockbtn">Öffnen</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
  <nav class="side" aria-label="Bereiche">
    <div class="brand"><span class="logo" data-icon="pulse"></span>Meine Daten</div>
    <div id="sideNav"></div>
    <div class="foot">
      <div class="sub" id="updated"></div>
      <div class="row2"><button class="ghost" id="themeBtn" title="Hell/Dunkel">Design: Auto</button></div>
      <div class="row2"><button class="ghost" id="logout">Sperren</button></div>
    </div>
  </nav>

  <main>
    <div class="topbar">
      <div>
        <h1 id="pageTitle">Übersicht</h1>
        <div class="sub" id="pageSub"></div>
      </div>
      <div class="rangebar">
        <button class="arrow" id="prevR" aria-label="Früherer Zeitraum">‹</button>
        <button id="rangeBtn" aria-haspopup="dialog" aria-expanded="false"><b id="rangeName"></b><span id="rangeDates"></span></button>
        <button class="arrow" id="nextR" aria-label="Späterer Zeitraum">›</button>
        <div id="rangePop" role="dialog" aria-label="Zeitraum wählen" hidden>
          <div class="presets" id="presets"></div>
          <div class="cal">
            <div class="calhead"><button id="calPrev" aria-label="Vorheriger Monat">‹</button><span class="muted">Eigenen Zeitraum wählen</span><button id="calNext" aria-label="Nächster Monat">›</button></div>
            <div class="months" id="months"></div>
            <div class="calfoot"><span id="calSel">Start- und Enddatum anklicken</span>
              <span><button class="ghost" id="calCancel">Abbrechen</button> <button class="primary" id="calApply" disabled>Übernehmen</button></span></div>
          </div>
        </div>
      </div>
    </div>

    <div id="alerts"></div>
    <div id="tips"></div>
    <section data-tab="ov"></section>
    <section data-tab="kraft" hidden></section>
    <section data-tab="health" hidden></section>
    <section data-tab="work" hidden></section>
    <section data-tab="sync" hidden></section>
    <section data-tab="help" hidden></section>
  </main>

  <nav class="bottom" id="bottomNav" aria-label="Bereiche"></nav>
</div>

<script>
"use strict";
const KEY_STORE = "dash_key_v1";
let DATA = null;
const $ = (id) => document.getElementById(id);
const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

// ================================================================ Entschlüsseln
async function fetchEnc() {
  const r = await fetch("data.enc.json?" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error("Daten nicht gefunden (" + r.status + ")");
  return r.json();
}
async function deriveKey(pw, enc) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(enc.salt), iterations: enc.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function decrypt(key, enc) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, key, b64(enc.ct));
  const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}
async function unlockWithStoredKey() {
  const raw = ls.get(KEY_STORE);
  if (!raw) return false;
  try {
    const enc = await fetchEnc();
    const key = await crypto.subtle.importKey("raw", b64(raw), "AES-GCM", false, ["decrypt"]);
    DATA = await decrypt(key, enc);
    show();
    return true;
  } catch (e) { ls.del(KEY_STORE); return false; }
}
$("lockform").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("err").textContent = ""; $("unlockbtn").disabled = true; $("unlockbtn").textContent = "Entschlüssle …";
  try {
    const enc = await fetchEnc();
    const key = await deriveKey($("pw").value, enc);
    DATA = await decrypt(key, enc);
    if ($("remember").checked) {
      const rawKey = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      ls.set(KEY_STORE, btoa(String.fromCharCode(...rawKey)));
    }
    show();
  } catch (e) {
    $("err").textContent = e.name === "OperationError" ? "Passwort falsch." : (e.message || "Fehler beim Laden.");
  } finally { $("unlockbtn").disabled = false; $("unlockbtn").textContent = "Öffnen"; }
});
$("logout").addEventListener("click", () => { ls.del(KEY_STORE); location.reload(); });

// ================================================================ Symbole
const ICONS = {
  scale: '<rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8.5 9.5a5 5 0 0 1 7 0M12 9.5l1.6-1.8"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
  dumbbell: '<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',
  heart: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  briefcase: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',
  sync: '<path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/>',
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  shoe: '<path d="M3 17h17a1 1 0 0 0 1-1v-.5a3 3 0 0 0-2.4-2.9l-4.1-.8L12 8l-3 1-1-3H5L3 13z"/><path d="M3 20h18"/>',
  battery: '<rect x="3" y="7" width="16" height="10" rx="2"/><path d="M21 10v4M7 10v4M10 10v4"/>',
  wave: '<path d="M3 12h3l2-5 3 10 3-8 2 3h5"/>',
  flame: '<path d="M12 21a6 6 0 0 0 6-6c0-4-3-6-4-10-1.5 2-2 3.5-2 5-1-1-1.5-2-1.6-3C8 9 6 11.5 6 15a6 6 0 0 0 6 6z"/>',
  bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  lungs: '<path d="M12 4v8M12 12c-1 2-3 2-4 1M12 12c1 2 3 2 4 1M8 7c-3 1-5 6-5 10 0 2 1 3 3 3s3-2 3-5V9M16 7c3 1 5 6 5 10 0 2-1 3-3 3s-3-2-3-5V9"/>',
  run: '<circle cx="14" cy="4.5" r="1.8"/><path d="M8 21l3-6 3 2v5M6 11l3-3 4 1 2 3 3 1M11 15l1-5"/>',
  bike: '<circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h5l3 7M10 9 8 6H6M15 9l-3 7"/>',
  mountain: '<path d="M3 20 10 8l4 6 2-3 5 9z"/>',
  swim: '<path d="M3 18c2 0 2-1.5 4.5-1.5S9.5 18 12 18s2.5-1.5 4.5-1.5S19 18 21 18M8 14l3-4 4 2 2-3"/><circle cx="17" cy="6" r="1.8"/>',
  pulse: '<path d="M3 12h4l2-6 4 12 2-6h6"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  book: '<path d="M7 4h9a3 3 0 0 1 3 3v13H9a2 2 0 0 1-2-2z"/><path d="M11 9h5M11 13h3"/>',
  smile: '<circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c1.8 2 5.2 2 7 0M9 9.5h.01M15 9.5h.01"/>',
};
const icon = (n, color) => `<svg viewBox="0 0 24 24" fill="none" stroke="${color || "currentColor"}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ICONS.pulse}</svg>`;
const icBox = (n, cssVar) => `<span class="ic" style="background:color-mix(in srgb, var(${cssVar}) 15%, transparent);color:var(${cssVar})">${icon(n)}</span>`;
document.querySelectorAll("[data-icon]").forEach(e => e.innerHTML = icon(e.dataset.icon, "#fff"));

// ================================================================ Hilfen
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt = (n, d = 0) => n == null || isNaN(n) ? "–" : Number(n).toLocaleString("de-CH", { maximumFractionDigits: d, minimumFractionDigits: d });
const vals = (a) => a.filter(x => x != null && !isNaN(x));
const avg = (a) => { const v = vals(a); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
const sum = (a) => a.reduce((s, x) => s + (x || 0), 0);
const maxOf = (a) => { const v = vals(a); return v.length ? Math.max(...v) : null; };
const minOf = (a) => { const v = vals(a); return v.length ? Math.min(...v) : null; };
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
const pad2 = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const todayIso = () => iso(new Date());
const dd = (s) => s ? `${s.slice(8, 10)}.${s.slice(5, 7)}.${s.slice(2, 4)}` : "–";
const ddShort = (s) => s ? `${s.slice(8, 10)}.${s.slice(5, 7)}.` : "–";
const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const MONTHS = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
const MON3 = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
const wd = (s) => WD[parse(s).getDay()];
const hmS = (min) => min == null || isNaN(min) ? "–" : `${Math.floor(min / 60)}:${pad2(Math.round(min % 60))} h`;
const hm = (min) => min == null ? "–" : `${Math.floor(min / 60)} h ${pad2(Math.round(min % 60))} min`;
function weekStart(s) { const d = parse(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); }
function ago(t) {
  const min = Math.round((Date.now() - new Date(t)) / 60000);
  if (min < 60) return `vor ${min} Min.`; if (min < 48 * 60) return `vor ${Math.round(min / 60)} Std.`; return `vor ${Math.round(min / 1440)} Tagen`;
}
function tile(label, value, note = "") { return `<div class="tile"><div class="label">${esc(label)}</div><div class="value">${value}</div><div class="note">${esc(note)}</div></div>`; }
function card(cls, iconName, cssVar, title, body, right = "") {
  return `<div class="card ${cls}"><div class="ch">${icBox(iconName, cssVar)}<h3>${esc(title)}</h3>${right ? `<span class="right">${right}</span>` : ""}</div>${body}</div>`;
}

// ================================================================ Zeitraum
const PRESETS = [
  ["today", "Heute"], ["yesterday", "Gestern"], ["thisWeek", "Diese Woche"], ["lastWeek", "Letzte Woche"],
  ["last2w", "Letzte 2 Wochen"], ["thisMonth", "Dieser Monat"], ["lastMonth", "Letzter Monat"],
  ["thisYear", "Dieses Jahr"], ["lastYear", "Letztes Jahr"], ["all", "Alles"],
];
function presetRange(key) {
  const t = todayIso(), d = parse(t), y = d.getFullYear(), m = d.getMonth();
  switch (key) {
    case "today": return { from: t, to: t, unit: "day" };
    case "yesterday": { const x = addDays(t, -1); return { from: x, to: x, unit: "day" }; }
    case "thisWeek": return { from: weekStart(t), to: t, unit: "week" };
    case "lastWeek": { const w = addDays(weekStart(t), -7); return { from: w, to: addDays(w, 6), unit: "week" }; }
    case "last2w": return { from: addDays(t, -13), to: t, unit: "days14" };
    case "thisMonth": return { from: iso(new Date(y, m, 1)), to: t, unit: "month" };
    case "lastMonth": return { from: iso(new Date(y, m - 1, 1)), to: iso(new Date(y, m, 0)), unit: "month" };
    case "thisYear": return { from: `${y}-01-01`, to: t, unit: "year" };
    case "lastYear": return { from: `${y - 1}-01-01`, to: `${y - 1}-12-31`, unit: "year" };
    default: return { from: "0000-01-01", to: "9999-12-31", unit: "all" };
  }
}
let R = (() => {
  try {
    const s = JSON.parse(ls.get("dash_range") || "null");
    if (s && s.key === "custom" && s.from && s.to) return s;
    if (s && PRESETS.some(p => p[0] === s.key)) return { key: s.key, ...presetRange(s.key) };
  } catch (e) {}
  return { key: "last2w", ...presetRange("last2w") };
})();
function setRange(r) { R = r; ls.set("dash_range", JSON.stringify(r)); render(); }
const inR = (arr) => (arr || []).filter(x => x.d >= R.from && x.d <= R.to);
const single = () => R.from === R.to;
let SCOPE = null;  // Daten des aktuellen Bereichs: "Alles" beginnt beim ersten eigenen Eintrag
function dataBounds() {
  const src = SCOPE || [...(DATA.health || []), ...(DATA.training || []), ...(DATA.work || []), ...(DATA.activities || [])];
  const all = src.map(x => x.d).filter(Boolean).sort();
  return { min: all[0] || todayIso(), max: todayIso() };
}
function effRange() {  // tatsächlich abgedeckter Zeitraum (für Mittelwerte und Diagramm-Raster)
  const b = dataBounds();
  const from = R.from < b.min ? b.min : R.from, to = R.to > b.max ? b.max : R.to;
  return { from, to, days: Math.max(1, daysBetween(from, to) + 1) };
}
function rangeLabel() {
  const p = PRESETS.find(x => x[0] === R.key);
  const name = p ? p[1] : "Zeitraum";
  if (R.key === "all") { const e = effRange(); return [name, `${dd(e.from)} – heute`]; }
  if (single()) return [name === "Zeitraum" ? wd(R.from) : name, `${wd(R.from)}, ${dd(R.from)}`];
  return [name, `${ddShort(R.from)} – ${dd(R.to)}`];
}
function shiftRange(dir) {
  if (R.key === "all") return;
  let from, to;
  if (R.unit === "month") {
    const f = parse(R.from); f.setDate(1); f.setMonth(f.getMonth() + dir);
    from = iso(f); to = iso(new Date(f.getFullYear(), f.getMonth() + 1, 0));
  } else if (R.unit === "year") {
    const y = +R.from.slice(0, 4) + dir; from = `${y}-01-01`; to = `${y}-12-31`;
  } else if (R.unit === "week") {
    from = addDays(weekStart(R.from), 7 * dir); to = addDays(from, 6);
  } else {
    const n = daysBetween(R.from, R.to) + 1; from = addDays(R.from, n * dir); to = addDays(R.to, n * dir);
  }
  const t = todayIso();
  if (from > t) return;
  if (to > t) to = t;
  // passt der neue Zeitraum genau auf eine Vorgabe, deren Namen zeigen
  const hit = PRESETS.find(([k]) => { const p = presetRange(k); return p.from === from && p.to === to && k !== "all"; });
  setRange(hit ? { key: hit[0], ...presetRange(hit[0]) } : { key: "custom", from, to, unit: R.unit });
}
$("prevR").addEventListener("click", () => shiftRange(-1));
$("nextR").addEventListener("click", () => shiftRange(1));

// Auswahlfenster mit Kalender
let calMonth = null, pick = null;
$("presets").innerHTML = PRESETS.map(([k, n]) => `<button data-k="${k}">${n}</button>`).join("");
$("presets").addEventListener("click", (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  closePop(); setRange({ key: b.dataset.k, ...presetRange(b.dataset.k) });
});
function openPop() {
  pick = { from: R.key === "all" ? null : R.from, to: R.key === "all" ? null : R.to };
  const base = parse(R.key === "all" ? todayIso() : R.to);
  calMonth = new Date(base.getFullYear(), base.getMonth() - (innerWidth > 820 ? 1 : 0), 1, 12);
  $("rangePop").hidden = false; $("rangeBtn").setAttribute("aria-expanded", "true");
  drawCal();
}
function closePop() { $("rangePop").hidden = true; $("rangeBtn").setAttribute("aria-expanded", "false"); }
$("rangeBtn").addEventListener("click", (ev) => { ev.stopPropagation(); $("rangePop").hidden ? openPop() : closePop(); });
$("calCancel").addEventListener("click", closePop);
$("calPrev").addEventListener("click", () => { calMonth.setMonth(calMonth.getMonth() - 1); drawCal(); });
$("calNext").addEventListener("click", () => { calMonth.setMonth(calMonth.getMonth() + 1); drawCal(); });
document.addEventListener("click", (ev) => { if (!$("rangePop").hidden && !ev.target.closest(".rangebar")) closePop(); });
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") closePop(); });
$("calApply").addEventListener("click", () => {
  if (!pick.from) return;
  const from = pick.from, to = pick.to || pick.from;
  const hit = PRESETS.find(([k]) => { const p = presetRange(k); return p.from === from && p.to === to && k !== "all"; });
  closePop();
  setRange(hit ? { key: hit[0], ...presetRange(hit[0]) } : { key: "custom", from, to, unit: "days" });
});
$("months").addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-d]"); if (!b) return;
  const d = b.dataset.d;
  if (!pick.from || pick.to) pick = { from: d, to: null };
  else if (d < pick.from) pick = { from: d, to: pick.from };
  else pick.to = d;
  drawCal();
});
function drawCal() {
  for (const b of $("presets").querySelectorAll("button")) b.setAttribute("aria-pressed", b.dataset.k === R.key ? "true" : "false");
  const t = todayIso(); let html = "";
  for (let k = 0; k < 2; k++) {
    const m0 = new Date(calMonth.getFullYear(), calMonth.getMonth() + k, 1, 12);
    const lead = (m0.getDay() + 6) % 7, nd = new Date(m0.getFullYear(), m0.getMonth() + 1, 0).getDate();
    html += `<div class="month"><h4>${MONTHS[m0.getMonth()]} ${m0.getFullYear()}</h4><div class="days">` +
      ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"].map(x => `<div class="wd">${x}</div>`).join("") + "<div></div>".repeat(lead);
    for (let i = 1; i <= nd; i++) {

const SEG = [["arm_r", "Arm rechts"], ["arm_l", "Arm links"], ["rumpf", "Rumpf"], ["bein_r", "Bein rechts"], ["bein_l", "Bein links"]];
function bodyCard() {
  const all = DATA.body, br = inR(all), last = all[all.length - 1], first = br.length ? br[0] : null;
  const ref = br.length >= 2 ? br[0] : null, cur = br.length ? br[br.length - 1] : last;
  const delta = (k, unit, dec = 1, goodUp = null) => {
    if (!ref || ref[k] == null || cur[k] == null) return "";
    const d = cur[k] - ref[k]; if (Math.abs(d) < 0.05) return `<small class="dl">±0</small>`;
    const good = goodUp == null ? "" : (d > 0) === goodUp ? " good" : " bad";
    return `<small class="dl${good}">${d > 0 ? "+" : "−"}${fmt(Math.abs(d), dec)}${unit}</small>`;
  };
  const kv = [["Gewicht", "w", "kg", null], ["Fett", "fp", "%", false], ["Fettmasse", "fm", "kg", false], ["Muskeln", "mm", "kg", true],
    ["Wasser", "wa", "kg", null], ["Knochen", "bo", "kg", null], ["Viszeralfett", "vi", "", false], ["Grundumsatz", "bmr", "kcal", null], ["Stoffwechselalter", "age", "J.", false]]
    .filter(([, k]) => cur[k] != null)

  const segLast = [...all].reverse().find(x => x.seg && x.seg.muskel);
  const note = br.length ? `${br.length} Messung${br.length > 1 ? "en" : ""} ${rangeWord()}${ref ? ` · Veränderung seit ${dd(ref.d)}` : ""}` : `Keine Messung ${rangeWord()} – letzte vom ${dd(last.d)}`;
  return card("c12", "scale", "--weight", "Körper", `
    <div class="muted" style="margin-bottom:8px">${note}</div>

      <div><div class="kv body-kv">${kv}</div></div>

        <div class="muted" style="font-size:12px;text-align:center">je Körperteil · Messung vom ${dd(segLast.d)}</div></div>` : ""}
    </div>
    <div class="bodycharts">
      <div><div class="muted bct">Gewicht (kg)</div><div class="chartbox" id="bWeight"></div></div>
      <div><div class="muted bct">Muskeln (kg)</div><div class="chartbox" id="bMus"></div></div>
      <div><div class="muted bct">Fettmasse (kg)</div><div class="chartbox" id="bFat"></div></div>
    </div>`, last ? `Withings · zuletzt ${dd(last.d)}` : "Withings");

function segSvg(m) {
  // Ansicht von vorne: dein rechter Arm ist links im Bild
  const S = m.seg, mus = S.muskel || {}, fat = S.fett || {};
  const maxM = { arm: Math.max(mus.arm_r || 0, mus.arm_l || 0) || 1, bein: Math.max(mus.bein_r || 0, mus.bein_l || 0) || 1, rumpf: mus.rumpf || 1 };
  const part = (k, x, y, w, h) => {
    const grp = k.split("_")[0], op = 0.18 + 0.32 * (mus[k] || 0) / maxM[grp];
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(w, h) / 2.4}" fill="var(--musc)" fill-opacity="${op.toFixed(2)}" stroke="var(--musc)" stroke-opacity=".45"/>`;
  };
  const lab = (k, x, y, anchor) => `<text x="${x}" y="${y}" text-anchor="${anchor}" class="segv">${fmt(mus[k], 1)}</text><text x="${x}" y="${y + 15}" text-anchor="${anchor}" class="segf">${fmt(fat[k], 1)}</text>`;
  return `<svg viewBox="0 0 280 236" class="segsvg" role="img" aria-label="Muskeln und Fett je Körperteil">
    <circle cx="140" cy="20" r="15" fill="var(--track)"/>
    ${part("rumpf", 108, 40, 64, 92)}${part("arm_r", 80, 42, 24, 90)}${part("arm_l", 176, 42, 24, 90)}
    ${part("bein_r", 110, 138, 28, 92)}${part("bein_l", 142, 138, 28, 92)}
    ${lab("rumpf", 140, 82, "middle")}
    ${lab("arm_r", 72, 82, "end")}${lab("arm_l", 208, 82, "start")}
    ${lab("bein_r", 102, 182, "end")}${lab("bein_l", 178, 182, "start")}
    <text x="72" y="124" text-anchor="end" class="segl">rechts</text><text x="208" y="124" class="segl">links</text>
  </svg>`;
}

  if (last && (Date.now() - new Date(last.start)) / 36e5 > 26) out.push(["", `Seit ${ago(last.start).replace("vor ", "")} kein Abgleich mehr. Läuft der Laptop?`]);
  const td = tokenDays();
  if (td != null && td <= 14) out.push([td <= 3 ? "bad" : "", td < 0 ? "GitHub-Token ist abgelaufen – das Dashboard wird nicht mehr aktualisiert. Neues Token erstellen, dann Dashboard_einrichten.bat."
    : `GitHub-Token läuft in ${td} Tag${td === 1 ? "" : "en"} ab. Neues Token erstellen, dann Dashboard_einrichten.bat.`]);
  $("alerts").innerHTML = out.map(([c, t]) => `<div class="alert ${c}"><span class="dot"></span><span>${t}</span>${TAB !== "sync" ? '<button data-go="sync">Details</button>' : ""}</div>`).join("");
}
document.addEventListener("click", (ev) => { const b = ev.target.closest("[data-goto]"); if (!b) return; TAB = b.dataset.goto; history.replaceState(null, "", "#" + TAB); scrollTo(0, 0); render(); });
$("alerts").addEventListener("click", (ev) => { const b = ev.target.closest("[data-go]"); if (!b) return; TAB = b.dataset.go; history.replaceState(null, "", "#" + TAB); render(); });

// ---------------------------------------------------------------- Handbuch (kommt verschlüsselt mit den Daten)
let helpView = "me";
function renderHelp() {
  const S = sec("help");
  const seg = `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px"><div class="seg" id="helpSeg">
    <button data-v="me" aria-pressed="${helpView === "me"}">Für mich</button><button data-v="tech" aria-pressed="${helpView === "tech"}">Technik (Mensch &amp; KI)</button></div>
    <span class="muted">Liegt verschlüsselt hier und als Datei im Ordner skripte</span></div>`;
  if (helpView === "tech") { S.dataset.loaded = ""; S.innerHTML = seg + techHtml(); bindHelp(S); return; }
  if (!DATA.handbuch) { S.innerHTML = `<div class="card"><div class="empty">Das Handbuch kommt mit dem nächsten Abgleich.</div></div>`; return; }
  if (S.dataset.loaded === "1" && S.dataset.theme === (document.documentElement.getAttribute("data-theme") || "")) return;
  const th = document.documentElement.getAttribute("data-theme");
  // fremde Schriften weglassen (Dashboard lädt bewusst nichts von aussen)
  let html = DATA.handbuch.replace(/<link[^>]+fonts\.(googleapis|gstatic)\.com[^>]*>/g, "");
  if (th) html = html.replace('<html lang="de">', `<html lang="de" data-theme="${th}">`);
  S.innerHTML = seg + `<iframe id="helpFrame" title="Handbuch" style="width:100%;border:0;border-radius:18px;min-height:70vh;display:block;background:var(--surface)"></iframe>`;
  const f = $("helpFrame");
  f.addEventListener("load", () => {
    const fit = () => { try { f.style.height = f.contentDocument.documentElement.scrollHeight + "px"; } catch (e) {} };
    fit(); setTimeout(fit, 400);
    try { f.contentDocument.querySelectorAll("a[href^='http']").forEach(a => a.target = "_blank"); } catch (e) {}
  });
  f.srcdoc = html;
  S.dataset.loaded = "1"; S.dataset.theme = th || "";
  bindHelp(S);
}
function bindHelp(S) {
  $("helpSeg").onclick = (ev) => { const b = ev.target.closest("button"); if (!b) return; helpView = b.dataset.v; S.dataset.loaded = ""; renderHelp(); };
  S.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => {
    const txt = b.dataset.copy === "system" ? JSON.stringify(DATA.system, null, 2) : (DATA.infoblatt || "");
    const done = () => { const o = b.textContent; b.textContent = "Kopiert ✓"; setTimeout(() => b.textContent = o, 1500); };
    const fb = () => { const t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); done(); } catch (e) {} t.remove(); };
    try { navigator.clipboard.writeText(txt).then(done, fb); } catch (e) { fb(); }
  });
}
// Kleines Markdown → HTML (für UEBERSICHT.md, ohne fremde Bibliothek)
function mdToHtml(md) {
  const inline = (t) => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = md.replace(/\r/g, "").split("\n"); let out = "", i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { let b = ""; i++; while (i < lines.length && !/^```/.test(lines[i])) b += lines[i++] + "\n"; i++; out += `<pre><code>${esc(b)}</code></pre>`; continue; }
    const h = l.match(/^(#{1,4})\s+(.*)/); if (h) { out += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; i++; continue; }
    if (/^---+\s*$/.test(l)) { out += "<hr>"; i++; continue; }
    if (/^\|/.test(l)) {
      const rows = []; while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = (r) => r.replace(/^\||\|\s*$/g, "").split("|").map(c => c.trim());
      const body = rows.filter((r, k) => !(k === 1 && /^\|[\s:|-]+\|?\s*$/.test(r)));
      out += `<div class="tw"><table><thead><tr>${cells(body[0]).map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${body.slice(1).map(r => `<tr>${cells(r).map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const ordered = /^\s*\d+\./.test(l); let items = [];
      while (i < lines.length && (/^\s*([-*]|\d+\.)\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        if (/^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, "")); else items[items.length - 1] += " " + lines[i].trim();
        i++;
      }
      out += `<${ordered ? "ol" : "ul"}>${items.map(x => `<li>${inline(x)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`; continue;
    }
    if (!l.trim()) { i++; continue; }
    let para = l; i++;
    while (i < lines.length && lines[i].trim() && !/^(#|```|\||---|\s*([-*]|\d+\.)\s)/.test(lines[i])) para += " " + lines[i++].trim();
    out += `<p>${inline(para)}</p>`;
  }
  return out;
}
function techHtml() {
  const S = DATA.system;
  if (!S) return `<div class="card"><div class="empty">Die Systemkarte kommt mit dem nächsten Abgleich.</div></div>`;
  const val = (v) => Array.isArray(v) ? `<ul>${v.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : esc(v);
  const expPill = (t) => { if (!t) return ""; const c = /^ja/.test(t) ? "warn" : "ok"; return `<span class="status ${c}"><span class="dot"></span></span> ${esc(t)}`; };
  const td = tokenDays();
  const rows = (d) => [["Was", d.was], ["Schnittstelle", d.schnittstelle], ["Repository", d.repository], ["Adresse", d.adresse], ["Dateien", d.dateien],
    ["Zugang", d.zugang], ["Liegt in", d.zugang_ort], ["Läuft ab", d.laeuft_ab ? { html: expPill(d.laeuft_ab) + (d.name === "GitHub – Website" && DATA.status.tokenExpires ? ` <span class="muted">(laut GitHub: ${dd(DATA.status.tokenExpires.slice(0, 10))}${td != null ? `, noch ${td} Tage` : ""})</span>` : "") } : null],
    ["Einordnung", d.einordnung], ["Erneuern", d.erneuern], ["Code", d.code], ["Ziel", d.ziel], ["Kopie", d.kopie], ["Datenschutz", d.datenschutz], ["Risiko", d.risiko], ["Achtung", d.achtung]]
    .filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${v && v.html ? v.html : val(v)}</dd>`).join("");
  const V = S.verschluesselung || {};
  return `
    <div class="card sys" style="margin-bottom:14px"><div class="ch">${icBox("book", "--s1")}<h3>Systemkarte</h3><span class="right">Stand ${esc(S.stand || "")}</span></div>
      <p class="muted" style="margin:0 0 12px">${esc(S._hinweis || "")}</p>
      <dl><dt>Code</dt><dd><code>${esc(S.code_ordner)}</code></dd><dt>Daten Laptop</dt><dd><code>${esc(S.daten_ordner_laptop)}</code></dd>
        <dt>Python</dt><dd>${esc(S.python)}</dd><dt>Tresor</dt><dd>${esc(S.tresor)}</dd></dl>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="ghost" data-copy="system">Systemkarte kopieren (JSON)</button><button class="ghost" data-copy="infoblatt">Infoblatt kopieren (für eine KI)</button></div>
    </div>
    <h3 style="margin:22px 0 10px;font-size:16px">Was automatisch läuft</h3>
    <div class="sysgrid">${(S.zeitplaene || []).map(z => `<div class="card sys"><div class="ch">${icBox("clock", "--s1")}<h3>${esc(z.name)}</h3></div>
      <dl><dt>Wann</dt><dd>${esc(z.wann)}</dd><dt>Startet</dt><dd><code>${esc(z.startet)}</code></dd><dt>Ablauf</dt><dd><ol style="margin:0;padding-left:18px">${z.schritte.map(x => `<li>${esc(x)}</li>`).join("")}</ol></dd></dl></div>`).join("")}</div>
    <h3 style="margin:22px 0 10px;font-size:16px">Dienste, Zugänge und Tokens</h3>
    <div class="sysgrid">${(S.dienste || []).map(d => `<div class="card sys"><div class="ch">${icBox(/GitHub/.test(d.name) ? "sync" : /Garmin/.test(d.name) ? "heart" : /Speediance/.test(d.name) ? "dumbbell" : /Clockify/.test(d.name) ? "briefcase" : /LM Studio/.test(d.name) ? "bolt" : "grid", "--s1")}<h3>${esc(d.name)}</h3></div><dl>${rows(d)}</dl></div>`).join("")}</div>
    <h3 style="margin:22px 0 10px;font-size:16px">Verschlüsselung und Warnungen</h3>
    <div class="sysgrid">
      <div class="card sys"><dl><dt>Verfahren</dt><dd>${esc(V.verfahren)}</dd>
        <dt>Dashboard</dt><dd>Passwort: ${esc(V.dashboard?.passwort)}<br>Salt: <code>${esc(V.dashboard?.salt)}</code><br>Entschlüsselt: ${esc(V.dashboard?.entschluesselt)}</dd>
        <dt>Tagebuch</dt><dd>Passwort: ${esc(V.tagebuch?.passwort)}<br>Salt: ${esc(V.tagebuch?.salt)}<br>Entschlüsselt: ${esc(V.tagebuch?.entschluesselt)}</dd>
        <dt>Im Dashboard</dt><dd>${esc(V.im_dashboard_vom_tagebuch)}</dd></dl></div>
      <div class="card sys"><dl><dt>Windows</dt><dd>${esc(S.warnungen?.windows_meldung)}</dd><dt>Dashboard</dt><dd>${esc(S.warnungen?.dashboard)}</dd></dl>
        <h3 style="margin:14px 0 6px">Regeln für eine KI</h3><ol style="margin:0;padding-left:18px;font-size:14px">${(S.regeln_fuer_ki || []).map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>
    </div>
    ${DATA.infoblatt ? `<details class="card" style="margin-top:14px"><summary>${icBox("book", "--s1")}Ausführliches Infoblatt (UEBERSICHT.md)</summary><div class="md" style="margin-top:12px">${mdToHtml(DATA.infoblatt)}</div></details>` : ""}`;
}

// ---------------------------------------------------------------- Synchronisation
function renderSync() {
  const D = DATA, S = sec("sync");
  const runs = (D.runs || []).slice().reverse(), last = runs[0], lastOk = runs.find(r => r.ok);
  let statusHtml = "–";
  if (last) {
    const stale = (Date.now() - new Date(last.start)) / 3600000 > 26;
    const cls = !last.ok ? "bad" : stale ? "warn" : "ok", txt = !last.ok ? "Fehler" : stale ? "Länger kein Lauf" : "OK";
    statusHtml = `<span class="status ${cls}"><span class="dot" aria-hidden="true"></span>${txt}</span>`;
  }
  const rows = runs.slice(0, 30).map(r => {
    const s = r.speediance || {}, g = r.garmin || {}, c = r.clockify;
    const st = r.ok ? `<span class="status ok"><span class="dot"></span>OK</span>` : `<span class="status bad"><span class="dot"></span>Fehler</span>`;
    const msg = (r.meldungen || []).map(esc).join("<br>");
    return `<tr><td>${new Date(r.start).toLocaleString("de-CH", { dateStyle: "short", timeStyle: "short" })}</td>
      <td>${fmt(r.dauer_s / 60, 1)} Min.</td>
      <td>${s.neu != null ? `${s.hochgeladen || 0} hochgeladen` + (s.fehler ? `, ${s.fehler} Fehler` : "") : "–"}</td>
      <td>${g.gebremst ? "gebremst" : g.tage != null ? `${g.tage} Tage, ${g.aktivitaeten} Akt.` : "–"}</td>
      <td>${c ? (c.ok ? "OK" : "Fehler") : "–"}</td><td>${st}${msg ? `<div class="muted">${msg}</div>` : ""}</td></tr>`;
  }).join("");
  S.innerHTML = `
    <div class="tiles">
      ${tile("Letzter Lauf", last ? ago(last.start) : "–", last ? new Date(last.start).toLocaleString("de-CH", { dateStyle: "short", timeStyle: "short" }) : "noch keine Läufe")}
      ${tile("Status", statusHtml, lastOk && last && !last.ok ? "Letzter fehlerfreier Lauf " + ago(lastOk.start) : "")}
      ${tile("Trainings gesichert", fmt((D.trainingAll || D.training || []).length), "Speediance, gesamt")}
      ${tile("Garmin-Sicherung", D.status.garminBackupUntil ? "ab " + dd(D.status.garminBackupUntil) : "–", D.status.garminComplete ? "vollständig" : "Vergangenheit wird nachgeholt")}
      ${tile("Clockify-Export", D.status.clockifyLast ? dd(D.status.clockifyLast) : "–", "letzter Export")}
      ${(() => { const td = tokenDays(); const e = D.status.tokenExpires;
        const cls = td == null ? "" : td < 0 || td <= 3 ? "bad" : td <= 14 ? "warn" : "ok";
        const v = td == null ? "–" : `<span class="status ${cls}"><span class="dot"></span>${td < 0 ? "abgelaufen" : td > 60 ? "noch " + Math.round(td / 30.4) + " Mt." : "noch " + td + " Tage"}</span>`;
        return tile("GitHub-Token", v, e ? "läuft ab am " + dd(e.slice(0, 10)) : "wird beim nächsten Upload gelesen"); })()}
    </div>
    <div class="card" style="margin-bottom:14px"><div class="ch">${icBox("book", "--s1")}<h3>Wie funktioniert das alles?</h3><span class="right"><button class="ghost" data-goto="help">Info &amp; Technik öffnen</button></span></div>
      <div class="muted">Handbuch für dich und Systemkarte für Technik und KI: Garmin, Speediance, Clockify, GitHub, Tokens, Verschlüsselung.</div></div>
    <div class="card"><div class="ch">${icBox("sync", "--s1")}<h3>Letzte Läufe</h3><span class="right">alle 3 Std., solange der Laptop läuft</span></div>
      <div class="tablewrap"><table><thead><tr><th>Zeitpunkt</th><th>Dauer</th><th>Speediance → Garmin</th><th>Garmin-Sicherung</th><th>Clockify</th><th>Status</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="6" class="empty">Noch keine Läufe protokolliert.</td></tr>`}</tbody></table></div></div>`;
}

unlockWithStoredKey();
